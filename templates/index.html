<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>bili2vrchat — B站上傳工具</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #1a1d23;
      --surface:  #22262e;
      --surface2: #2a2f3a;
      --border:   #333844;
      --accent:   #4e8ef7;
      --accent-h: #6ba3ff;
      --success:  #3ecf6e;
      --warn:     #f0a020;
      --danger:   #e05252;
      --text:     #dde1ea;
      --muted:    #9aa3b5;
      --row-sel:  rgba(78,142,247,0.22);
      --row-h:    rgba(255,255,255,0.06);
      --touch:    56px;
      --fs:       20px;
      --fs-sm:    17px;
      --fs-xs:    15px;
      --fs-lg:    26px;
      --pad:      20px;
      --gap:      16px;
      --radius:   10px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: var(--fs);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-tap-highlight-color: rgba(78, 142, 247, 0.25);
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 18px 28px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    header h1 {
      font-size: var(--fs-lg);
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.02em;
    }
    header .badge {
      font-size: var(--fs-xs);
      background: var(--accent);
      color: #fff;
      border-radius: 6px;
      padding: 6px 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    /* ── Main Layout ── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
    }

    /* ── Section cards ── */
    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 20px;
      overflow: hidden;
    }
    .section-title {
      font-size: var(--fs-sm);
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 16px 20px 14px;
      border-bottom: 1px solid var(--border);
    }
    .fmt-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .fmt-filter {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 400;
      text-transform: none;
      letter-spacing: 0;
      color: var(--text);
      font-size: var(--fs-sm);
    }
    .fmt-filter-select {
      background: var(--bg);
      border: 2px solid var(--border);
      color: var(--text);
      font-size: var(--fs-sm);
      padding: 12px 16px;
      border-radius: var(--radius);
      min-width: 200px;
      min-height: var(--touch);
    }
    .fmt-filter-select:focus { border-color: var(--accent); outline: none; }
    .fmt-filter-select option { background: var(--surface2); font-size: var(--fs-sm); }
    .section-body {
      padding: var(--pad);
    }

    /* ── URL Row ── */
    .url-row {
      display: flex;
      gap: var(--gap);
      flex-wrap: wrap;
    }
    .url-row input {
      flex: 1 1 280px;
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 14px 18px;
      font-size: var(--fs);
      min-height: var(--touch);
      outline: none;
      transition: border-color .15s;
    }
    .url-row input:focus { border-color: var(--accent); }
    .url-row input::placeholder { color: var(--muted); }

    /* ── Buttons ── */
    .btn {
      border: none;
      border-radius: var(--radius);
      padding: 14px 28px;
      font-size: var(--fs);
      font-weight: 600;
      min-height: var(--touch);
      min-width: var(--touch);
      cursor: pointer;
      white-space: nowrap;
      transition: background .12s, opacity .12s;
      touch-action: manipulation;
    }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-primary  { background: var(--accent); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-h); }
    .btn-ghost    { background: var(--surface2); color: var(--text); }
    .btn-ghost:hover:not(:disabled) { background: var(--border); }
    .btn-success  { background: var(--success); color: #000; }
    .btn-success:hover:not(:disabled) { opacity: .85; }

    /* ── Cookie warning ── */
    #cookieWarning {
      display: none;
      font-size: var(--fs-sm);
      color: var(--warn);
      padding: 14px 0 0;
      line-height: 1.5;
    }
    .cookie-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--gap);
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }
    .cookie-row input[type="file"] {
      font-size: var(--fs-sm);
      color: var(--muted);
      flex: 1 1 240px;
      min-height: var(--touch);
    }
    .cookie-platforms {
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: var(--fs-sm);
      flex: 1 1 100%;
    }
    .cookie-platforms .ok { color: var(--success); }
    .cookie-platforms .warn { color: var(--warn); }
    .cookie-platform-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    #cookieUploadMsg {
      font-size: var(--fs-sm);
      color: var(--success);
      width: 100%;
      margin-top: 8px;
    }

    /* ── Format table ── */
    .table-wrap {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    thead th {
      background: var(--surface2);
      color: var(--muted);
      font-size: var(--fs-xs);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 16px 18px;
      text-align: left;
      border-bottom: 2px solid var(--border);
      white-space: nowrap;
      user-select: none;
    }
    thead th.right { text-align: right; }

    tbody tr {
      border-bottom: 1px solid rgba(255,255,255,0.06);
      cursor: pointer;
      min-height: var(--touch);
    }
    tbody tr:hover   { background: var(--row-h); }
    tbody tr.selected { background: var(--row-sel); }
    tbody tr.selected td { color: #fff; }

    tbody td {
      padding: 16px 18px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: var(--fs-sm);
      vertical-align: middle;
    }
    tbody td.right { text-align: right; }

    .badge-codec {
      display: inline-block;
      font-size: var(--fs-xs);
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 6px;
      letter-spacing: 0.04em;
    }
    .codec-h264  { background: rgba(78,142,247,.25); color: #7eb4ff; }
    .codec-h265  { background: rgba(62,207,110,.2);  color: #5de08a; }
    .codec-av1   { background: rgba(240,160,32,.2);  color: #f0b030; }
    .codec-vp9   { background: rgba(180,100,240,.2); color: #c07ef0; }
    .codec-other { background: var(--surface2);      color: var(--muted); }

    .range-hdr { color: var(--warn); font-weight: 600; }

    .empty-hint {
      text-align: center;
      color: var(--muted);
      padding: 48px 24px;
      font-size: var(--fs-sm);
      line-height: 1.5;
    }

    /* ── Options row ── */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }
    @media (min-width: 720px) {
      .options-grid { grid-template-columns: 1fr 1fr; }
    }
    .field label {
      display: block;
      font-size: var(--fs-sm);
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .field input,
    .field select {
      width: 100%;
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 14px 16px;
      font-size: var(--fs);
      min-height: var(--touch);
      outline: none;
      transition: border-color .15s;
    }
    .field input:focus,
    .field select:focus { border-color: var(--accent); }
    .field input::placeholder { color: var(--muted); }
    .field select option { background: var(--surface2); }

    /* ── Action bar ── */
    .action-bar {
      display: flex;
      align-items: stretch;
      gap: var(--gap);
      flex-wrap: wrap;
    }
    .action-bar .btn-primary,
    .action-bar .btn-ghost#cancelBtn {
      flex: 1 1 200px;
    }
    #selInfo {
      font-size: var(--fs-sm);
      color: var(--muted);
      flex: 1 1 100%;
      padding: 8px 4px;
      line-height: 1.5;
    }
    #selInfo span { color: var(--text); font-weight: 600; }

    /* ── Status ── */
    #statusBox {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      margin-bottom: 20px;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .step-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }
    .step-dot.done    { background: var(--success); }
    .step-dot.error   { background: var(--danger); }
    .step-dot.spin {
      background: transparent;
      border: 2px solid var(--accent);
      border-top-color: transparent;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #statusMsg {
      font-size: var(--fs);
      color: var(--text);
      flex: 1;
      line-height: 1.5;
    }

    /* ── Result ── */
    #resultBox {
      display: none;
      background: var(--surface);
      border: 2px solid var(--success);
      border-radius: var(--radius);
      padding: 20px 24px;
      margin-bottom: 20px;
    }
    #resultBox .result-label {
      font-size: var(--fs-sm);
      font-weight: 700;
      color: var(--success);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .result-link-row {
      display: flex;
      align-items: stretch;
      gap: var(--gap);
      flex-wrap: wrap;
    }
    #resultUrl {
      flex: 1 1 280px;
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      color: #fff;
      padding: 14px 18px;
      font-size: var(--fs-sm);
      font-family: monospace;
      word-break: break-all;
      white-space: normal;
      cursor: text;
      user-select: all;
      min-height: var(--touch);
      display: flex;
      align-items: center;
    }
    .vrchat-hint {
      margin-top: 14px;
      font-size: var(--fs-sm);
      color: var(--muted);
      line-height: 1.5;
    }
    #previewVideo {
      width: 100%;
      max-height: 480px;
      margin-top: 16px;
      background: #000;
      border-radius: var(--radius);
      border: 2px solid var(--border);
    }
    .preview-speed {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 16px;
      font-size: var(--fs-sm);
      color: var(--muted);
      flex-wrap: wrap;
    }
    .preview-speed input[type="range"] {
      flex: 1 1 200px;
      accent-color: var(--accent);
      min-height: 40px;
      cursor: pointer;
    }
    #hwEncoderLabel {
      font-size: var(--fs-sm);
      color: var(--muted);
      margin-top: 12px;
      line-height: 1.5;
    }
    #videoMeta {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 20px;
      padding: var(--pad);
    }
    .video-meta-inner {
      display: flex;
      gap: 20px;
      align-items: flex-start;
      flex-wrap: wrap;
    }
    #videoThumb {
      width: min(280px, 100%);
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: var(--radius);
      border: 2px solid var(--border);
      background: var(--bg);
      flex-shrink: 0;
    }
    .video-meta-text {
      flex: 1;
      min-width: 200px;
    }
    #videoTitle {
      font-size: var(--fs-lg);
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
      margin-bottom: 12px;
      word-break: break-word;
    }
    .video-meta-sub {
      font-size: var(--fs-sm);
      color: var(--muted);
      line-height: 1.7;
    }

    .field-full { grid-column: 1 / -1; }

    .compat-check {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      cursor: pointer;
      text-transform: none;
      letter-spacing: 0;
      padding: 4px 0;
    }
    .compat-check input[type="checkbox"] {
      width: 28px;
      height: 28px;
      min-width: 28px;
      accent-color: var(--accent);
      margin-top: 2px;
      cursor: pointer;
    }
    .compat-check span {
      font-size: var(--fs);
      color: var(--text);
      line-height: 1.5;
    }
    .btn-sm {
      padding: 10px 18px;
      font-size: var(--fs-sm);
      min-height: 44px;
    }
    .fmt-count {
      color: var(--text);
      font-weight: 400;
      font-size: var(--fs-sm);
    }
  </style>
</head>
<body>

<header>
  <h1>🎬 bili2vrchat</h1>
  <span class="badge">B站 / YouTube → R2 → VRChat</span>
</header>

<main>

  <!-- URL 輸入 -->
  <div class="section">
    <div class="section-title">影片網址</div>
    <div class="section-body">
      <div class="url-row">
        <input type="text" id="urlInput" placeholder="B站或 YouTube 網址，如 bilibili.com/video/... 或 youtube.com/watch?v=..." autocomplete="off" spellcheck="false">
        <button class="btn btn-primary" id="fetchBtn" onclick="fetchFormats()">獲取格式</button>
      </div>
      <div id="cookieWarning">⚠ 此網址可能需要登入 cookie，請先上傳對應平台的 cookies.txt</div>
      <div class="cookie-row">
        <input type="file" id="cookieFile" accept=".txt,text/plain">
        <button class="btn btn-ghost" type="button" onclick="uploadCookie()">儲存到瀏覽器</button>
        <div class="cookie-platforms" id="cookiePlatforms"></div>
      </div>
      <div id="cookieUploadMsg"></div>
    </div>
  </div>

  <!-- 影片資訊 -->
  <div id="videoMeta">
    <div class="video-meta-inner">
      <img id="videoThumb" alt="" referrerpolicy="no-referrer">
      <div class="video-meta-text">
        <div id="videoTitle"></div>
        <div class="video-meta-sub">
          <div id="videoUploader"></div>
          <div id="videoDuration"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 格式列表 -->
  <div class="section">
    <div class="section-title fmt-header">
      <span>格式列表 <span id="fmtCount" class="fmt-count"></span></span>
      <label class="fmt-filter">
        <span>編碼</span>
        <select id="codecFilter" class="fmt-filter-select" onchange="applyCodecFilter()" disabled></select>
      </label>
    </div>
    <div class="table-wrap">
      <table id="fmtTable">
        <thead>
          <tr>
            <th>解析度</th>
            <th>範圍</th>
            <th>FPS</th>
            <th>編碼</th>
            <th class="right">大小</th>
          </tr>
        </thead>
        <tbody id="fmtBody">
          <tr><td colspan="5" class="empty-hint">請先輸入網址並點擊「獲取格式」</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- 選項 -->
  <div class="section">
    <div class="section-title">上傳選項</div>
    <div class="section-body">
      <div class="options-grid">
        <div class="field">
          <label>自訂路徑名稱（留空自動隨機）</label>
          <input type="text" id="keyPhrase" placeholder="例如: myvideo" autocomplete="off">
        </div>
        <div class="field">
          <label>保存時間</label>
          <select id="ttlSelect">
            <option value="3600">1 小時</option>
            <option value="86400">1 天</option>
            <option value="604800" selected>7 天</option>
            <option value="2592000">30 天</option>
            <option value="0">永久保存</option>
          </select>
        </div>
        <div class="field">
          <label>播放速度（上傳前永久變更）</label>
          <select id="playbackSpeed">
            <option value="0.5">0.5x（慢速）</option>
            <option value="0.75">0.75x</option>
            <option value="1" selected>1.0x（原速）</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
            <option value="1.75">1.75x</option>
            <option value="2">2.0x（快速）</option>
          </select>
        </div>
        <div class="field field-full">
          <label class="compat-check">
            <input type="checkbox" id="compatMode">
            <span>VRChat 相容模式 — 重新編碼為 H.264（修復固定時間點撕裂，較慢）</span>
          </label>
          <div id="hwEncoderLabel">編碼器：偵測中...</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 執行按鈕 -->
  <div class="section">
    <div class="section-body">
      <div class="action-bar">
        <button class="btn btn-primary" id="processBtn" onclick="startProcess()" disabled>下載並上傳</button>
        <button class="btn btn-ghost" id="cancelBtn" onclick="cancelProcess()" style="display:none">取消</button>
        <div id="selInfo">尚未選擇格式</div>
      </div>
    </div>
  </div>

  <!-- 狀態 -->
  <div id="statusBox">
    <div class="status-row">
      <div class="step-dot spin" id="stepDot"></div>
      <div id="statusMsg">等待中...</div>
    </div>
  </div>

  <!-- 結果 -->
  <div id="resultBox">
    <div class="result-label">✓ 上傳完成 — VRChat 直連</div>
    <div class="result-link-row">
      <div id="resultUrl"></div>
      <button class="btn btn-ghost" id="copyBtn" onclick="copyUrl()">複製</button>
    </div>
    <video id="previewVideo" controls playsinline></video>
    <div class="preview-speed">
      <label for="previewSpeed">預覽速度</label>
      <input type="range" id="previewSpeed" min="0.5" max="2" step="0.05" value="1">
      <span id="previewSpeedLabel">1.0x</span>
    </div>
    <div class="vrchat-hint">💡 在 VRChat 影片播放器中貼上此連結即可播放</div>
  </div>

</main>

<script src="/static/cookies.js"></script>
<script>
// ── 狀態 ──
let selectedFormat = null;
let activeJobId = null;
let resultUrl = '';

// ── Cookie (localStorage) ──
function updateCookieUI() {
  const status = CookieStore.getCookieStatus();
  const platformsEl = document.getElementById('cookiePlatforms');
  platformsEl.innerHTML = CookieStore.PLATFORMS.map(platform => {
    const label = CookieStore.platformLabel(platform);
    const cls = status[platform] ? 'ok' : 'warn';
    const text = status[platform] ? '已設定' : '未設定';
    const clearBtn = status[platform]
      ? `<button class="btn btn-ghost btn-sm" type="button" onclick="clearCookie('${platform}')">清除</button>`
      : '';
    return `<div class="cookie-platform-row ${cls}"><span>${label}: ${text}</span> ${clearBtn}</div>`;
  }).join('');
  updateCookieWarningForUrl(document.getElementById('urlInput').value.trim());
}

function updateCookieWarningForUrl(url) {
  const warn = document.getElementById('cookieWarning');
  const platform = CookieStore.detectPlatformFromUrl(url);
  if (!platform) {
    warn.style.display = 'none';
    return;
  }
  const hasCookie = CookieStore.getCookieStatus()[platform];
  warn.style.display = hasCookie ? 'none' : 'block';
  if (!hasCookie) {
    warn.textContent = `⚠ 此 ${CookieStore.platformLabel(platform)} 網址可能需要 cookie，請上傳 cookies.txt（依檔案內容自動辨識平台）`;
  }
}

function buildRequestBody(url, extra = {}) {
  const cookieContent = CookieStore.getCookieForUrl(url);
  const body = { url, ...extra };
  if (cookieContent) body.cookie_content = cookieContent;
  return body;
}

async function uploadCookie() {
  const input = document.getElementById('cookieFile');
  const msgEl = document.getElementById('cookieUploadMsg');
  msgEl.textContent = '';
  if (!input.files || !input.files.length) {
    alert('請先選擇 cookies.txt 檔案');
    return;
  }
  const file = input.files[0];
  try {
    const content = await file.text();
    const result = CookieStore.saveCookieFromFile(content, file.name);
    if (!result.ok) {
      alert(result.error);
      return;
    }
    input.value = '';
    msgEl.textContent = result.message;
    updateCookieUI();
  } catch (e) {
    alert('讀取失敗：' + e.message);
  }
}

function clearCookie(platform) {
  CookieStore.clearCookie(platform);
  document.getElementById('cookieUploadMsg').textContent = `已清除 ${CookieStore.platformLabel(platform)} cookie`;
  updateCookieUI();
}

updateCookieUI();
document.getElementById('urlInput').addEventListener('input', e => {
  updateCookieWarningForUrl(e.target.value.trim());
});

fetch('/api/hwaccel-status').then(r => r.json()).then(d => {
  const suffix = d.fallback ? ' (軟體)' : '';
  document.getElementById('hwEncoderLabel').textContent = `編碼器：${d.label}${suffix}`;
}).catch(() => {
  document.getElementById('hwEncoderLabel').textContent = '編碼器：未知';
});

const previewVideo = document.getElementById('previewVideo');
const previewSpeedInput = document.getElementById('previewSpeed');
const previewSpeedLabel = document.getElementById('previewSpeedLabel');

previewVideo.preservesPitch = true;
previewSpeedInput.addEventListener('input', () => {
  const speed = parseFloat(previewSpeedInput.value);
  previewVideo.playbackRate = speed;
  previewSpeedLabel.textContent = `${speed.toFixed(2)}x`;
});

// ── 取得格式 ──
async function fetchFormats() {
  const url = document.getElementById('urlInput').value.trim();
  if (!url) return;

  const btn = document.getElementById('fetchBtn');
  btn.disabled = true;
  btn.textContent = '載入中...';
  document.getElementById('fmtCount').textContent = '';
  document.getElementById('codecFilter').innerHTML = '';
  document.getElementById('codecFilter').disabled = true;
  document.getElementById('videoMeta').style.display = 'none';

  selectedFormat = null;
  document.getElementById('processBtn').disabled = true;
  document.getElementById('selInfo').textContent = '尚未選擇格式';

  setBody('<tr><td colspan="5" class="empty-hint">取得格式中，請稍候...</td></tr>');

  try {
    const res = await fetch('/api/fetch-formats', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(buildRequestBody(url)),
    });
    const data = await res.json();

    if (data.error) {
      setBody(`<tr><td colspan="5" class="empty-hint" style="color:var(--danger)">${esc(data.error)}</td></tr>`);
      return;
    }

    renderVideoMeta(data);
    renderFormats(data.formats || []);
    updateCookieWarningForUrl(url);

  } catch (e) {
    setBody(`<tr><td colspan="5" class="empty-hint" style="color:var(--danger)">網路錯誤：${esc(e.message)}</td></tr>`);
  } finally {
    btn.disabled = false;
    btn.textContent = '獲取格式';
  }
}

function renderVideoMeta(data) {
  const box = document.getElementById('videoMeta');
  const thumb = document.getElementById('videoThumb');
  const title = (data.title || '').trim();
  if (!title && !data.thumbnail) {
    box.style.display = 'none';
    return;
  }

  document.getElementById('videoTitle').textContent = title || '（無標題）';
  document.getElementById('videoUploader').textContent =
    data.uploader ? `UP主：${data.uploader}` : '';
  document.getElementById('videoDuration').textContent =
    data.duration_formatted ? `時長：${data.duration_formatted}` : '';

  if (data.thumbnail) {
    thumb.src = data.thumbnail;
    thumb.alt = title || '影片縮圖';
    thumb.style.display = '';
  } else {
    thumb.removeAttribute('src');
    thumb.style.display = 'none';
  }

  box.style.display = 'block';
}

function renderFormats(formats) {
  window._allFormats = formats;
  const filterEl = document.getElementById('codecFilter');

  if (!formats.length) {
    filterEl.innerHTML = '';
    filterEl.disabled = true;
    setBody('<tr><td colspan="5" class="empty-hint">未找到可用格式</td></tr>');
    document.getElementById('fmtCount').textContent = '';
    return;
  }

  populateCodecFilter(formats);
  applyCodecFilter();
}

function populateCodecFilter(formats) {
  const select = document.getElementById('codecFilter');
  const order = ['h264', 'h265', 'av1', 'vp9', 'other'];
  const families = [...new Set(formats.map(f => normalizeCodecFamily(f.codec)))];
  families.sort((a, b) => {
    const ai = order.indexOf(a);
    const bi = order.indexOf(b);
    return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
  });

  select.innerHTML = families.map(family =>
    `<option value="${family}">${codecFamilyLabel(family)}</option>`
  ).join('');
  select.value = families.includes('h264') ? 'h264' : families[0];
  select.disabled = families.length <= 1;
}

function applyCodecFilter() {
  const all = window._allFormats || [];
  const family = document.getElementById('codecFilter').value;
  const filtered = all.filter(f => normalizeCodecFamily(f.codec) === family);
  renderFormatRows(filtered, all.length);
}

function renderFormatRows(formats, totalCount) {
  window._formats = formats;
  updateFmtCount(formats.length, totalCount ?? formats.length);

  if (!formats.length) {
    setBody('<tr><td colspan="5" class="empty-hint">此編碼無可用格式</td></tr>');
    selectedFormat = null;
    document.getElementById('processBtn').disabled = true;
    document.getElementById('selInfo').textContent = '尚未選擇格式';
    return;
  }

  const rows = formats.map((f, i) => {
    const codecClass = getCodecClass(f.codec);
    const fps = f.fps ? f.fps.toFixed(3) + 'fps' : '-';
    const range = f.dynamic_range === 'HDR' || f.dynamic_range === 'HDR10' || f.dynamic_range === 'HLG'
      ? `<span class="range-hdr">${esc(f.dynamic_range)}</span>`
      : esc(f.dynamic_range || 'SDR');
    const size = f.size_approx ? '~' + f.size : f.size;
    return `<tr data-idx="${i}" onclick="selectRow(this,${i})">
      <td><strong>${esc(f.resolution)}</strong></td>
      <td>${range}</td>
      <td>${fps}</td>
      <td><span class="badge-codec ${codecClass}">${esc(f.codec)}</span></td>
      <td class="right">${esc(size)}</td>
    </tr>`;
  }).join('');

  setBody(rows);
  selectRow(document.querySelector('#fmtBody tr[data-idx="0"]'), 0);
}

function updateFmtCount(shown, total) {
  const el = document.getElementById('fmtCount');
  el.textContent = shown === total ? `${shown} 個` : `${shown} / ${total} 個`;
}

function normalizeCodecFamily(codec) {
  if (!codec) return 'other';
  const c = codec.toLowerCase();
  if (c.includes('h.264') || c.includes('264') || c.includes('avc')) return 'h264';
  if (c.includes('h.265') || c.includes('265') || c.includes('hevc')) return 'h265';
  if (c.includes('av1')) return 'av1';
  if (c.includes('vp9')) return 'vp9';
  return 'other';
}

function codecFamilyLabel(family) {
  const labels = {
    h264: 'H.264',
    h265: 'H.265 / HEVC',
    av1: 'AV1',
    vp9: 'VP9',
    other: '其他',
  };
  return labels[family] || family;
}

function selectRow(tr, idx) {
  if (!tr) return;
  document.querySelectorAll('#fmtBody tr').forEach(r => r.classList.remove('selected'));
  tr.classList.add('selected');
  selectedFormat = window._formats[idx];
  document.getElementById('processBtn').disabled = false;

  const f = selectedFormat;
  const fps = f.fps ? f.fps.toFixed(3) + ' fps' : '';
  document.getElementById('selInfo').innerHTML =
    `已選擇 <span>${esc(f.resolution)}</span>  ${esc(f.codec)}  ${fps}`;
}

function getCodecClass(codec) {
  if (!codec) return 'codec-other';
  const c = codec.toLowerCase();
  if (c.includes('h.264') || c.includes('264')) return 'codec-h264';
  if (c.includes('h.265') || c.includes('265') || c.includes('hevc')) return 'codec-h265';
  if (c.includes('av1')) return 'codec-av1';
  if (c.includes('vp9')) return 'codec-vp9';
  return 'codec-other';
}

// ── 開始處理 ──
async function startProcess() {
  if (!selectedFormat) return;

  const url        = document.getElementById('urlInput').value.trim();
  const keyPhrase  = document.getElementById('keyPhrase').value.trim();
  const ttl        = parseInt(document.getElementById('ttlSelect').value) || 0;
  const compatMode = document.getElementById('compatMode').checked;
  const playbackSpeed = parseFloat(document.getElementById('playbackSpeed').value) || 1;

  // 重置結果
  document.getElementById('resultBox').style.display  = 'none';
  document.getElementById('statusBox').style.display  = 'block';
  setStatus('spin', '準備下載...');

  document.getElementById('processBtn').disabled = true;
  document.getElementById('fetchBtn').disabled   = true;
  activeJobId = null;
  const cancelBtn = document.getElementById('cancelBtn');
  cancelBtn.style.display = 'none';
  cancelBtn.disabled = false;

  try {
    const response = await fetch('/api/process', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(buildRequestBody(url, {
        format_id: selectedFormat.format_id,
        key_phrase: keyPhrase,
        ttl,
        compat_mode: compatMode,
        playback_speed: playbackSpeed,
      })),
    });

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });

      // SSE 可能多行
      const lines = buf.split('\n');
      buf = lines.pop(); // 未完整行留著

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try {
          const evt = JSON.parse(line.slice(6));
          handleEvent(evt);
        } catch (_) {}
      }
    }
  } catch (e) {
    setStatus('error', `連線中斷：${e.message}`);
  } finally {
    activeJobId = null;
    document.getElementById('cancelBtn').style.display = 'none';
    document.getElementById('processBtn').disabled = false;
    document.getElementById('fetchBtn').disabled   = false;
  }
}

async function cancelProcess() {
  if (!activeJobId) return;
  const cancelBtn = document.getElementById('cancelBtn');
  cancelBtn.disabled = true;
  setStatus('spin', '正在取消...');
  try {
    await fetch('/api/process/cancel', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ job_id: activeJobId }),
    });
  } catch (_) {}
}

function handleEvent(evt) {
  if (evt.type === 'started') {
    activeJobId = evt.job_id;
    const cancelBtn = document.getElementById('cancelBtn');
    cancelBtn.style.display = '';
    cancelBtn.disabled = false;
  } else if (evt.type === 'status') {
    const dotClass = evt.step === 'done' ? 'done' : 'spin';
    setStatus(dotClass, evt.message);
  } else if (evt.type === 'error') {
    activeJobId = null;
    document.getElementById('cancelBtn').style.display = 'none';
    setStatus('error', '❌ ' + evt.message);
  } else if (evt.type === 'result') {
    activeJobId = null;
    document.getElementById('cancelBtn').style.display = 'none';
    setStatus('done', '完成');
    showResult(evt.url);
  }
}

function setStatus(dotClass, msg) {
  const dot = document.getElementById('stepDot');
  dot.className = 'step-dot ' + dotClass;
  document.getElementById('statusMsg').textContent = msg;
}

function showResult(url) {
  resultUrl = url;
  document.getElementById('resultUrl').textContent = url;
  document.getElementById('resultBox').style.display = 'block';
  document.getElementById('copyBtn').textContent = '複製';
  previewVideo.src = url;
  previewSpeedInput.value = '1';
  previewSpeedLabel.textContent = '1.0x';
  previewVideo.playbackRate = 1;
}

function copyUrl() {
  const btn = document.getElementById('copyBtn');
  const fallback = () => {
    // HTTP LAN 環境下 navigator.clipboard 被封鎖，用 execCommand 降級
    const ta = document.createElement('textarea');
    ta.value = resultUrl;
    ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch(_) {}
    document.body.removeChild(ta);
    btn.textContent = ok ? '✓ 已複製' : '請手動複製↑';
    setTimeout(() => { btn.textContent = '複製'; }, 2500);
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(resultUrl)
      .then(() => {
        btn.textContent = '✓ 已複製';
        setTimeout(() => { btn.textContent = '複製'; }, 2000);
      })
      .catch(fallback);
  } else {
    fallback();
  }
}

// ── 工具 ──
function setBody(html) {
  document.getElementById('fmtBody').innerHTML = html;
}

function esc(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// Enter 鍵直接獲取格式
document.getElementById('urlInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') fetchFormats();
});
</script>

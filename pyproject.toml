[project]
name = "bili2vrc"
version = "0.2.6"
description = "Make Bilibili videos watchable with friends at speed"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.34",
    "fastapi>=0.141.1",
    "python-dotenv>=1.2.2",
    "requests>=2.31",
    "uvicorn[standard]>=0.30",
    "yt-dlp>=2026.7.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bili2vrc"]

[tool.uv]
package = true

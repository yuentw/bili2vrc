# bili2vrchat — example Compose file
#   cp docker-compose.example.yml docker-compose.yml
#   cp .env.example .env   # fill in R2 / S3 credentials
#   docker compose up -d
#
# Transcode: bundled static ffmpeg at ffmpeg-bundled (software encoders only).
# yt-dlp always uses ffmpeg-bundled for merge — do NOT mount host ffmpeg over it.
# For NVENC, mount host binaries to ffmpeg-nvenc and set FFMPEG_BIN — see README.

services:
  bili2vrc:
    image: mio9/bili2vrc:latest
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - ./temp:/app/temp
    restart: unless-stopped

  # Optional: NVIDIA NVENC (Linux amd64 + NVIDIA Container Toolkit).
  # Mount host ffmpeg to ffmpeg-nvenc (NOT /usr/local/bin/ffmpeg — that breaks yt-dlp merge).
  #   docker compose --profile gpu up -d
  bili2vrc-gpu:
    profiles: [gpu]
    image: mio9/bili2vrc:latest
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
      FFMPEG_BIN: /usr/local/bin/ffmpeg-nvenc
      FFPROBE_BIN: /usr/local/bin/ffprobe-nvenc
      HW_ENCODER: h264_nvenc
    gpus: all
    volumes:
      - ./temp:/app/temp
      - ${FFMPEG_HOST_PATH:-/usr/bin/ffmpeg}:/usr/local/bin/ffmpeg-nvenc:ro
      - ${FFPROBE_HOST_PATH:-/usr/bin/ffprobe}:/usr/local/bin/ffprobe-nvenc:ro
    restart: unless-stopped

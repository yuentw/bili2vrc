# bili2vrchat — example Compose file
#   cp docker-compose.example.yml docker-compose.yml
#   cp .env.example .env   # fill in R2 / S3 credentials
#   docker compose up -d
#
# Transcode: bundled static ffmpeg — CPU software encoders only
# (libx264 / libx265 / libsvtav1). No NVENC / QSV / VAAPI / libplacebo in Docker.
# For NVIDIA or other hardware encode, run natively — see README Install & run.

services:
  bili2vrc:
    image: mio9/bili2vrc:latest
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - ./temp:/app/temp
    restart: unless-stopped
